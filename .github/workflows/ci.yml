name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relay"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Only the trace/run-store tests use Postgres; agents run against a mocked LLM, DocPilot and ops data.
      TEST_DATABASE_URL: postgresql://relay:relay@localhost:5432/relay_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
