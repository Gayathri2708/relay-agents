name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # Agents run against a mocked LLM, DocPilot and ops data: no secrets, network or database needed.
      - run: pytest -q
