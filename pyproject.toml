[project]
name = "relay"
version = "0.1.0"
description = "Multi-agent incident-response assistant: triage, investigate, plan. Humans approve; nothing auto-executes."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.50",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["relay", "relay.agents", "relay.tools"]

[tool.setuptools.package-data]
relay = ["schema.sql", "static/*.html"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"seed/seed_db.py" = ["E501"]  # fixture tables read better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
